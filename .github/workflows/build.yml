name: build-fpkg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unzip

      - name: Fetch toolchain
        run: ./scripts/setup-toolchain.sh

      - name: Build package
        run: ./scripts/build.sh

      - name: Verify package
        run: |
          ./tests/test_job_conf.sh
          ./scripts/verify-package.sh out/ps4-linux-installer.pkg

      - name: Checksum
        run: |
          mkdir -p dist
          cp out/ps4-linux-installer.pkg dist/
          ( cd dist && sha256sum ps4-linux-installer.pkg > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ps4-linux-installer
          path: |
            dist/ps4-linux-installer.pkg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
